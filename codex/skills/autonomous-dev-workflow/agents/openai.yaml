interface:
  display_name: "Autonomous Dev Workflow"
  short_description: "Spawn-first gated multi-agent feature delivery"
  default_prompt: "Use $autonomous-dev-workflow. Run the Main Orchestrator as PREMIUM (gpt-5.5). Aggressively delegate bounded technical work to subagents: STANDARD or CHEAP, both currently resolved to gpt-5.2. Parallelize independent assignments. Main only receives/synthesizes results, resolves requirement/architecture/reviewer conflicts, and enforces gates; do not let main become the normal coder, tester, researcher, reviewer, debugger, or documentation worker."
policy:
  allow_implicit_invocation: true
