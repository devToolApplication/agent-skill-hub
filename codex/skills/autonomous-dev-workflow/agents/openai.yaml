interface:
  display_name: "Autonomous Dev Workflow"
  short_description: "Skill-aware spawn-first gated feature delivery"
  default_prompt: "Use $autonomous-dev-workflow. Run Main as PREMIUM (gpt-5.5). Aggressively delegate bounded work to STANDARD/CHEAP subagents (currently gpt-5.2), parallelizing independent assignments. Before EVERY spawn resolve role -> model_tier -> required_skills/conditional_skills using references/09-skill-routing.md, and include those skills in the assignment contract. Missing mandatory skills must return SKILL_UNAVAILABLE; never silently substitute another workflow. Main only coordinates, synthesizes, resolves global requirement/architecture/reviewer conflicts, and enforces gates. Enforce local integration + full local live/E2E/regression PASS before candidate push/CD, then rerun integration/live/E2E/regression on the deployed test environment before UAT."
policy:
  allow_implicit_invocation: true
