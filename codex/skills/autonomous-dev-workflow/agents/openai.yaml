interface:
  display_name: "Autonomous Dev Workflow"
  short_description: "Skill-aware spawn-first gated feature delivery"
  default_prompt: "Use $autonomous-dev-workflow. Run Main as PREMIUM (gpt-5.5). Aggressively delegate bounded work to STANDARD/CHEAP subagents (currently gpt-5.2), parallelizing independent assignments. Before normal delegation, discover the actual skill roots available to the current Codex runtime/workspace and build a verified session skill index. Before EVERY spawn resolve role -> model_tier -> canonical required_skills/conditional_skills -> concrete installed skill_dir + skill_file using references/09-skill-routing.md. Put those exact directories/SKILL.md paths directly in the subagent prompt and explicitly require the child to read/follow them before work. Children must use supplied skill paths and must not rediscover/substitute workflow skills. Missing skills return SKILL_UNAVAILABLE; invalid supplied paths return SKILL_PATH_INVALID to Main for re-resolution. Main only coordinates, synthesizes, resolves global requirement/architecture/reviewer conflicts, and enforces gates. Enforce local integration + full local live/E2E/regression PASS before candidate push/CD, then rerun integration/live/E2E/regression on the deployed test environment before UAT."
policy:
  allow_implicit_invocation: true
