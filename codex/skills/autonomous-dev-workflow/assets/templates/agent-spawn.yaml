agent_id: "<unique-id>"
role: "<role>"

# Logical routing tier. Spawned agents normally use STANDARD or CHEAP.
# PREMIUM is reserved for the Main Orchestrator.
model_tier: "<STANDARD|CHEAP>"

# Resolved from assets/templates/model-profile.example.yaml.
# Current mapping: STANDARD -> gpt-5.2, CHEAP -> gpt-5.2.
model: "gpt-5.2"

# Skills are resolved from references/09-skill-routing.md before spawn.
# Every listed required skill MUST be available and loaded by the subagent.
required_skills:
  - "<skill-id>"

# Add only triggers relevant to this assignment.
conditional_skills:
  on_debug:
    - "systematic-debugging"
  on_review_fix:
    - "receiving-code-review"

objective: "<bounded objective>"
inputs:
  - "<exact file, excerpt, diff, command, or requirement ID>"
standards:
  - "<applicable standard only>"
permissions:
  read_code: true
  write_code: false
  write_tests: false
  run_tests: false
  read_docs: true
  write_feature_docs: false
  write_service_docs: false
  modify_requirements: false
  modify_architecture: false
  run_live_system: false
expected_output:
  schema: "<implementation-result|reviewer-result|research-result|live-result>"
stop_conditions:
  - "assignment complete"
  - "insufficient evidence"
  - "required skill unavailable"
  - "blocking environment failure"

on_skill_unavailable:
  status: "SKILL_UNAVAILABLE"
  action: "return_to_main_without_substitution"
