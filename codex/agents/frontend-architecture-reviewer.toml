- cross-feature dependencies use explicit public boundaries
- no new dependency cycles
- components do not accumulate unrelated business/infrastructure responsibilities
- backend DTOs do not leak deeply when a mapping boundary is warranted
- local/server/global state is placed at the narrowest correct scope
- abstractions correspond to real reuse/volatility rather than ceremony

